    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1115" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="LadingLens is a shipping inbox-control system: every email accounted for, every expected shipment reconciled, every verdict traceable to its source line."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LadingLens" />
    <meta property="og:title" content="LadingLens — Every email accounted for." />
    <meta
      property="og:description"
      content="Two independent gates for a shipping inbox: every received message accounted for, every expected shipment reconciled, every verdict clickable back to its source line."
    />
    <meta property="og:url" content="https://averis-222536409832.asia-southeast1.run.app/" />
    <meta property="og:image" content="https://averis-222536409832.asia-southeast1.run.app/brand/og-banner.png" />

    <script>
      try {
        var stored = localStorage.getItem('ladinglens-theme')
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
